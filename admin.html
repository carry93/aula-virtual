<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Profesor - Aula Virtual</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .container { max-width: 900px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Cabecera y Botón de Cierre (Crucial) -->
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 rounded shadow-sm border-start border-primary border-5">
            <h2 class="m-0 text-primary">👨‍🏫 Panel del Profesor</h2>
            <button class="btn btn-danger btn-lg fw-bold shadow" onclick="closeClass()">🛑 Finalizar Clase y Destruir Datos</button>
        </div>

        <div class="row">
            <!-- PANEL IZQUIERDO: Controles (Tokens y Subidas) -->
            <div class="col-md-5">
                
                <!-- Tarjeta: Gestión de Tokens -->
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body">
                        <h5 class="text-secondary">Claves de Acceso</h5>
                        <button class="btn btn-primary w-100 mb-3 fw-bold" onclick="generateToken()">+ Generar Nuevo Token</button>
                        <ul id="tokens-list" class="list-group list-group-flush mb-0 border rounded">
                            <li class="list-group-item text-muted text-center">Ningún token activo</li>
                        </ul>
                    </div>
                </div>

                <!-- Tarjeta: Subir Materiales -->
                <div class="card shadow-sm mb-4 border-0">
                    <div class="card-body">
                        <h5 class="text-secondary mb-3">Compartir Material</h5>

                        <!-- Bootstrap Tabs para separar Enlace / Archivo -->
                        <ul class="nav nav-tabs mb-3" id="myTab" role="tablist">
                          <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-bold" id="link-tab" data-bs-toggle="tab" data-bs-target="#link-pane" type="button" role="tab">🔗 Enlace</button>
                          </li>
                          <li class="nav-item" role="presentation">
                            <button class="nav-link fw-bold" id="file-tab" data-bs-toggle="tab" data-bs-target="#file-pane" type="button" role="tab">📄 Archivo Físico</button>
                          </li>
                        </ul>

                        <div class="tab-content" id="myTabContent">
                          <!-- Formulario para Enlaces -->
                          <div class="tab-pane fade show active" id="link-pane" role="tabpanel">
                              <input type="text" id="link-title" class="form-control mb-2" placeholder="Título (Ej: Wikipedia, YouTube...)">
                              <input type="url" id="link-url" class="form-control mb-3" placeholder="https://...">
                              <button class="btn btn-success w-100" onclick="addLink()">Compartir Enlace</button>
                          </div>
                          <!-- Formulario para Archivos -->
                          <div class="tab-pane fade" id="file-pane" role="tabpanel">
                              <input type="file" id="file-input" class="form-control mb-3">
                              <button class="btn btn-success w-100" id="btn-upload" onclick="uploadFile()">Subir Archivo (.pdf, .zip, etc)</button>
                          </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: Lista en Vivo de Materiales -->
            <div class="col-md-7">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0 text-secondary">Materiales Compartidos en la Pizarra</h5>
                            <button class="btn btn-sm btn-outline-secondary" onclick="loadStatus()">🔄 Refrescar</button>
                        </div>
                        <ul class="list-group" id="materials-list">
                            <li class="list-group-item text-muted text-center py-4 bg-light border-dashed">La pizarra está vacía.</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (necesario para las tabs) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Lógica del Profesor con Vanilla JavaScript -->
    <script>
        // Cargar datos actuales desde el backend al abrir la página
        document.addEventListener('DOMContentLoaded', loadStatus);

        async function loadStatus() {
            try {
                const res = await fetch('/api/admin/status');
                const data = await res.json();
                renderTokens(data.activeTokens);
                renderMaterials(data.materials);
            } catch (e) {
                console.error('Error de conexión:', e);
            }
        }

        // Pintar lista de tokens en el HTML
        function renderTokens(tokens) {
            const list = document.getElementById('tokens-list');
            if (tokens.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center">Ningún token activo</li>';
                return;
            }
            list.innerHTML = '';
            tokens.forEach(t => {
                list.innerHTML += `<li class="list-group-item fw-bold text-center text-primary fs-4 letter-spacing-1 bg-light">${t}</li>`;
            });
        }

        // Pintar lista de materiales
        function renderMaterials(materials) {
            const list = document.getElementById('materials-list');
            if (materials.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center py-4">No hay materiales compartidos.</li>';
                return;
            }
            list.innerHTML = '';
            materials.forEach(m => {
                const icon = m.type === 'link' ? '🔗' : '📄';
                const extraInfo = m.type === 'link' ? `<a href="${m.url}" target="_blank">${m.url}</a>` : 'Guardado en servidor temporalmente';
                list.innerHTML += `
                    <li class="list-group-item py-3">
                        <div class="d-flex w-100 justify-content-between align-items-center">
                            <h6 class="mb-1">${icon} ${m.title}</h6>
                            <span class="badge ${m.type === 'link' ? 'bg-primary' : 'bg-success'} rounded-pill text-uppercase">${m.type}</span>
                        </div>
                        <small class="text-muted">${extraInfo}</small>
                    </li>
                `;
            });
        }

        // Solicitar nuevo token
        async function generateToken() {
            const res = await fetch('/api/admin/token', { method: 'POST' });
            const data = await res.json();
            renderTokens(data.activeTokens);
        }

        // Enviar nuevo enlace
        async function addLink() {
            const title = document.getElementById('link-title').value.trim();
            const url = document.getElementById('link-url').value.trim();
            
            if(!title || !url) return alert('Por favor completa el título y la URL del enlace.');

            await fetch('/api/admin/material/link', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, url })
            });

            document.getElementById('link-title').value = '';
            document.getElementById('link-url').value = '';
            loadStatus();
        }

        // Enviar archivo físico por FormData
        async function uploadFile() {
            const fileInput = document.getElementById('file-input');
            if (!fileInput.files.length) return alert('Debes seleccionar un archivo primero.');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const btn = document.getElementById('btn-upload');
            btn.disabled = true;
            btn.innerText = 'Subiendo... ⏳';

            try {
                await fetch('/api/admin/material/file', {
                    method: 'POST',
                    body: formData
                });
            } catch(e) {
                alert('Error subiendo archivo');
            }

            fileInput.value = '';
            btn.disabled = false;
            btn.innerText = 'Subir Archivo (.pdf, .zip, etc)';
            loadStatus();
        }

        // Cerrar la clase y formatear la data (Destrucción total)
        async function closeClass() {
            const confirmacion = confirm('⚠️ ATENCIÓN: ¿Estás seguro de cerrar la clase? \n\nEsto borrará permanentemente de la memoria todos los tokens, enlaces compartidos, y ELIMINARÁ físicamente los archivos subidos al disco. Los alumnos serán desconectados inmediatamente.');
            if (!confirmacion) return;

            await fetch('/api/admin/close', { method: 'POST' });
            alert('✔️ La clase ha finalizado. Toda la información y archivos han sido destruidos por seguridad.');
            loadStatus();
        }
    </script>
</body>
</html>
