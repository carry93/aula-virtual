<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Virtual - Estudiante</title>
    <!-- Favicon @ -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>@</text></svg>">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 600px; margin-top: 80px; }
        #materials-section { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm text-center p-4">
            <h2 class="mb-1 text-muted fs-4">Aula Virtual</h2>
            <h1 class="mb-4 fw-bold text-primary display-5">compuclase.click</h1>

            <!-- SECCIÓN 1: Ingreso de Token -->
            <div id="login-section">
                <div class="alert alert-info text-start mb-4">
                    <strong>Pasos para entrar:</strong>
                    <ol class="mb-0 mt-1">
                        <li>Pídele a tu profesor el código de la clase de hoy.</li>
                        <li>Escríbelo en la casilla que está abajo.</li>
                        <li>Haz clic en "Ingresar a Clase" para ver y descargar tus materiales.</li>
                    </ol>
                </div>
                <div class="input-group mb-3">
                    <input type="text" id="token-input" class="form-control form-control-lg text-center fw-bold" placeholder="Ej: 4F2A1B" style="text-transform: uppercase;">
                </div>
                <button class="btn btn-primary btn-lg w-100" onclick="login()">Ingresar a Clase</button>
                <div id="login-error" class="alert alert-danger mt-3" style="display: none;"></div>
            </div>

            <!-- SECCIÓN 2: Lista de Materiales (Oculta por defecto) -->
            <div id="materials-section">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                    <h4 class="mb-0 text-primary">Materiales de la Clase</h4>
                    <button class="btn btn-sm btn-outline-danger" onclick="logout()">Salir</button>
                </div>
                <ul class="list-group text-start shadow-sm" id="materials-list">
                    <!-- Los materiales se insertarán aquí dinámicamente -->
                </ul>
                <button class="btn btn-light border shadow-sm mt-4 w-100 fw-bold text-secondary" onclick="loadMaterials()">
                    🔄 Refrescar Materiales
                </button>
            </div>
        </div>
    </div>

    <!-- Lógica del Estudiante con Vanilla JavaScript -->
    <script>
        let currentToken = '';

        // Función para validar el token contra el Backend
        async function login() {
            const token = document.getElementById('token-input').value.trim().toUpperCase();
            if (!token) return;

            try {
                const res = await fetch('/api/student/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();
                if (res.ok) {
                    currentToken = data.token; // Guardar token localmente
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('materials-section').style.display = 'block';
                    loadMaterials();
                } else {
                    showError(data.error);
                }
            } catch (err) {
                showError('Error de red. Asegúrate que el servidor esté corriendo.');
            }
        }

        // Función para cargar los materiales del Backend
        async function loadMaterials() {
            try {
                // Pasamos el token en los headers de autorización
                const res = await fetch('/api/student/materials', {
                    headers: { 'Authorization': currentToken }
                });

                if (res.status === 403) {
                    alert('Acceso denegado: La clase ha sido cerrada por el profesor o tu token ya no es válido.');
                    logout();
                    return;
                }

                const materials = await res.json();
                const list = document.getElementById('materials-list');
                list.innerHTML = '';

                if (materials.length === 0) {
                    list.innerHTML = '<li class="list-group-item text-muted text-center py-4">No hay materiales compartidos aún.</li>';
                    return;
                }

                // Renderizar cada material dependiendo de su tipo
                materials.forEach(m => {
                    const li = document.createElement('li');
                    li.className = 'list-group-item d-flex justify-content-between align-items-center py-3';

                    if (m.type === 'link') {
                        li.innerHTML = `
                            <div class="text-truncate pe-3"><strong>🔗 ${m.title}</strong><br><small class="text-muted">${m.url}</small></div>
                            <a href="${m.url}" target="_blank" class="btn btn-sm btn-outline-primary px-3">Abrir</a>
                        `;
                    } else if (m.type === 'file') {
                        // Para descargar, pasamos el token por la query string del enlace
                        li.innerHTML = `
                            <div class="text-truncate pe-3"><strong>📄 ${m.title}</strong></div>
                            <a href="/api/download/${m.id}?token=${currentToken}" class="btn btn-sm btn-success px-3">Descargar</a>
                        `;
                    }
                    list.appendChild(li);
                });
            } catch (err) {
                console.error('Error cargando materiales:', err);
            }
        }

        // Función para volver a la pantalla inicial
        function logout() {
            currentToken = '';
            document.getElementById('token-input').value = '';
            document.getElementById('materials-section').style.display = 'none';
            document.getElementById('login-section').style.display = 'block';
        }

        // Utilidad para mostrar alertas visuales
        function showError(msg) {
            const el = document.getElementById('login-error');
            el.innerText = msg;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 4000);
        }
    </script>
</body>
</html>
